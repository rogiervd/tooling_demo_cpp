name: Check formatting

on:
  push:
    branches: [ main, develop, test-github-actions ]
  pull_request:
    branches: [ main, develop, test-github-actions ]

  workflow_dispatch:

jobs:
  check-formatting:
    # Use the standard clang-format on the operation system.
    runs-on: ubuntu-26.04
        
    steps:
    - uses: actions/checkout@v7

    - name: Install buildifier
      run: |
        curl -Lo ./buildifier https://github.com/bazelbuild/buildtools/releases/download/v7.3.1/buildifier-linux-amd64
        chmod +x ./buildifier

    - name: Check formatting of Bazel files
      id: buildifier
      run: ./buildifier -mode=diff -lint=off -r .
      continue-on-error: true

    - name: Check formatting of C++ files
      shell: bash
      # This should show incorrectly formatted code, and return with a nonzero
      # exit code if there are formatting problems.
      run: clang-format --dry-run -Werror `find . -name '*.?pp'`
      # It might be useful to hide commits that only format code from git blame:
      # https://docs.github.com/en/repositories/working-with-files/using-files/
      # viewing-a-file#ignore-commits-in-the-blame-view

    - name: Fail job if buildifier failed
      if: steps.buildifier.outcome == 'failure'
      run: exit 1
