name: Static checks

on:
  push:
    branches: [ main, develop, test-github-actions ]
  pull_request:
    branches: [ main, develop, test-github-actions ]

  workflow_dispatch:

jobs:
  clang-tidy:
    # clang-tidy might behave slightly differently on different operating
    # systems, but hopefully using a recent Ubuntu will make it cover a fair
    # amount.
    runs-on: ubuntu-26.04
        
    steps:
    - uses: actions/checkout@v7
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true
    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    - run: bazel build //... --config clang-tidy
      env:
        C_INCLUDE_PATH: "/usr/include/x86_64-linux-gnu:/usr/include"
        CPLUS_INCLUDE_PATH: "/usr/include/x86_64-linux-gnu:/usr/include"
