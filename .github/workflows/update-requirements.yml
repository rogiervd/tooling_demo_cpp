# Every two months, upgrade the Python packages in
# documentation/requirements.txt and open a pull request with the result.
name: Update Python requirements
on:
  schedule:
    # On the first day of every odd month.
    - cron: "17 6 1 1,3,5,7,9,11 *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-requirements:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Share repository cache between workflows.
          repository-cache: true
      # requirements.update does not take extra arguments, so use
      # requirements.run to pass arguments to uv.
      # Only use package versions that have been out for at least 14 days.
      - run: |
          bazel run //documentation:requirements.run -- --upgrade \
            --exclude-newer "$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          # Pull requests created with the default GITHUB_TOKEN do not trigger
          # other workflows, so CI would not run on them.
          # Set the REQUIREMENTS_UPDATE_TOKEN secret to a token that can push
          # and create pull requests to make CI run.
          token: ${{ secrets.REQUIREMENTS_UPDATE_TOKEN || github.token }}
          branch: automation/update-requirements
          delete-branch: true
          add-paths: documentation/requirements.txt
          commit-message: Update Python documentation dependencies
          title: Update Python documentation dependencies
          body: |
            Upgrade the Python packages in `documentation/requirements.txt`
            with

            ```
            bazel run //documentation:requirements.run -- --upgrade
            ```

            This pull request was created by the
            `${{ github.workflow }}` workflow.
